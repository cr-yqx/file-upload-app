<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ room.name }} - AI 学习资料房间</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/room.css') }}">
</head>
<body data-room-slug="{{ room.slug }}" data-room-name="{{ room.name }}" data-authorized="{{ 'true' if authorized else 'false' }}">
    <main class="container">
        <header class="header">
            <div>
                <h1>{{ room.name }}</h1>
                <p>房间标识：<strong>{{ room.slug }}</strong></p>
                <p>分享链接：<a id="shareLink" href="{{ request.base_url }}" target="_blank">{{ request.base_url }}</a></p>
            </div>
            <a class="home-link" href="/">返回入口</a>
        </header>

        {% if is_deprecated %}
        <div class="deprecated-banner">
            你正在访问旧入口映射路径。建议使用新接口：/api/rooms/&lt;room_slug&gt;/...
        </div>
        {% endif %}

        <section id="authSection" class="panel" {% if authorized %}hidden{% endif %}>
            <h2>输入房间口令</h2>
            <form id="authForm" class="inline-form">
                <input type="password" id="authPasscode" minlength="4" maxlength="64" placeholder="请输入口令" required>
                <button type="submit" class="btn-primary">解锁房间</button>
            </form>
        </section>

        <section id="workspace" {% if not authorized %}hidden{% endif %}>
            <section class="panel upload-panel">
                <h2>上传资料</h2>
                <form id="uploadForm" class="inline-form">
                    <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.gif,.webp,.pdf" required>
                    <button type="submit" class="btn-primary" id="uploadButton">上传</button>
                </form>
                <p class="tips">支持 JPG/JPEG/PNG/GIF/WEBP/PDF，单文件最大 10MB。PDF 会自动生成摘要。</p>
            </section>

            <section class="panel">
                <div class="panel-title-row">
                    <h2>文件列表</h2>
                    <button id="refreshButton" class="btn-secondary">刷新</button>
                </div>
                <div id="loading" class="loading" hidden>加载中...</div>
                <div id="emptyState" class="empty" hidden>当前房间还没有文件。</div>
                <div id="fileList" class="file-list"></div>
            </section>
        </section>

        <div id="globalMessage" class="message" hidden></div>
    </main>

    <script src="{{ url_for('static', filename='js/room.js') }}"></script>
</body>
</html>
