<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 学习资料房间</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/rooms.css') }}">
</head>
<body data-default-room-slug="{{ default_room_slug }}">
    <div class="entry-bg" aria-hidden="true">
        <span class="orb orb-a"></span>
        <span class="orb orb-b"></span>
        <span class="orb orb-c"></span>
    </div>

    <main class="entry-shell">
        <section class="brand-panel glass">
            <p class="eyebrow">Meeting Learning Room</p>
            <h1>把学习资料变成可协作的知识房间</h1>
            <p class="lead">
                创建口令房间后，和同学进行面对面讨论，上传资料、评论互动、实时查看协作者动态，并自动沉淀会议总结。
            </p>

            <div class="feature-pills">
                <span>口令分享</span>
                <span>PDF 自动摘要</span>
                <span>协作互动</span>
                <span>Railway 部署</span>
            </div>

            <div class="quick-actions">
                <button id="quickDemoButton" type="button" class="btn-secondary">快速进入默认房间</button>
                <div class="share-copy">
                    <input id="sharePreview" type="text" readonly value="{{ request.host_url.rstrip('/') }}/r/{{ default_room_slug }}">
                    <button id="copyShareButton" type="button" class="btn-ghost">复制链接</button>
                </div>
            </div>
        </section>

        <section class="forms-panel">
            <article class="glass card">
                <div class="card-head">
                    <h2>创建房间</h2>
                    <p>一键生成分享链接，默认自动进入。</p>
                </div>
                <form id="createRoomForm" class="form-grid">
                    <label>
                        房间名称
                        <input type="text" id="createRoomName" maxlength="80" placeholder="例如：机器学习读书会" required>
                    </label>
                    <label>
                        房间标识（可选）
                        <input type="text" id="createRoomSlug" maxlength="40" placeholder="例如：ml-study-group">
                    </label>
                    <label>
                        房间口令
                        <input type="password" id="createRoomPasscode" minlength="4" maxlength="64" placeholder="至少 4 位" required>
                    </label>
                    <button type="submit" class="btn-primary">创建并进入</button>
                </form>
                <div id="createResult" class="result" hidden></div>
            </article>

            <article class="glass card">
                <div class="card-head">
                    <h2>加入房间</h2>
                    <p>输入房间标识和口令后进入协作空间。</p>
                </div>
                <form id="joinRoomForm" class="form-grid">
                    <label>
                        房间标识
                        <input type="text" id="joinRoomSlug" maxlength="40" placeholder="例如：ml-study-group" required>
                    </label>
                    <label>
                        房间口令
                        <input type="password" id="joinRoomPasscode" minlength="4" maxlength="64" required>
                    </label>
                    <button type="submit" class="btn-primary">验证后进入</button>
                </form>
                <p class="tips">兼容旧地址：<a href="/files">/files</a> 会自动跳转到默认房间。</p>
            </article>
        </section>

        <div id="globalMessage" class="message" hidden></div>
    </main>

    <script src="{{ url_for('static', filename='js/rooms.js') }}"></script>
</body>
</html>
